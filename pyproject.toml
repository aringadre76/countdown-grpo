[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "countdown-grpo"
version = "0.1.0"
description = "RLVR experiments teaching Qwen3.5-0.8B-Base to solve Countdown arithmetic tasks with GRPO."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arin Gadre" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]
train = [
  "accelerate==1.14.0",
  "datasets==5.0.1",
  "peft==0.20.0",
  "transformers==5.16.1",
  "trl==1.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
